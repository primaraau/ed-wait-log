name: Log NSW ED waiting counts
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
      - name: Commit new rows
        run: |
          git config user.name "ed-wait-log"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ED waits $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet && git push --quiet
