name: Log NSW ED waiting counts
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 collect.py
      - run: python3 alert.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Commit new rows
        run: |
          git config user.name "ed-wait-log"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ED waits $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet && git push --quiet
